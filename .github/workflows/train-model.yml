name: Train creator model

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements.txt
      - name: Export labelled training data
        env:
          # Defaults to the app's pipeline export; override with a TRAINING_DATA_URL secret if needed.
          TRAINING_DATA_URL: ${{ secrets.TRAINING_DATA_URL || 'https://project--6ea691b4-6d72-4909-8327-9db061692868.lovable.app/api/public/pipeline/training-data' }}
          PIPELINE_API_TOKEN: ${{ secrets.PIPELINE_API_TOKEN }}
        run: |
          test -n "$TRAINING_DATA_URL"
          test -n "$PIPELINE_API_TOKEN"
          mkdir -p ml/data
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $PIPELINE_API_TOKEN" \
            "$TRAINING_DATA_URL" --output ml/data/labelled.jsonl
      - run: python ml/train.py ml/data/labelled.jsonl src/lib/model/model-weights.json
      - name: Check model metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path("src/lib/model/model-weights.json").read_text())
          metrics = model["metrics"]
          print(json.dumps(metrics, indent=2))
          if metrics["roc_auc"] < 0.75:
              print("Warning: prototype model is below the demo ROC-AUC target.")
          PY
      - name: Open model update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Retrain creator model"
          title: "Retrain creator model"
          body: |
            Automated model artifact generated by the n8n retraining workflow.

            Review the time-split metrics and calibration before merging.
          branch: automation/retrain-creator-model
